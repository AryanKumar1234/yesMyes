name: Build & Sign APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Extract project zip (if present)
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP — extracting…"
            unzip -o "$ZIP" -d .
          else
            echo "No zip found at repo root — assuming files were uploaded individually."
          fi

      - name: Locate Gradle project root
        id: locate
        run: |
          MATCH=$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$MATCH" ]; then
            echo "::error::No settings.gradle found anywhere in this repo (searched 4 levels deep)."
            exit 1
          fi
          DIR=$(dirname "$MATCH")
          echo "Found Gradle project at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Fix root build.gradle repositories conflict
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.2'
              }
          }
          EOF
          echo "build.gradle rewritten:"
          cat build.gradle

      - name: Fix app/build.gradle (targetSdk + lint)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          def ksFile = rootProject.file("keystore.properties")
          def ksProps = new Properties()
          if (ksFile.exists()) ksProps.load(new FileInputStream(ksFile))

          android {
              namespace   'com.smsforwarder'
              compileSdk  33

              defaultConfig {
                  applicationId "com.smsforwarder"
                  minSdk       21
                  targetSdk    33
                  versionCode  2
                  versionName  "1.1"
              }

              signingConfigs {
                  release {
                      if (ksFile.exists()) {
                          storeFile     file(ksProps['storeFile'])
                          storePassword ksProps['storePassword']
                          keyAlias      ksProps['keyAlias']
                          keyPassword   ksProps['keyPassword']
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled   false
                      signingConfig   signingConfigs.release
                  }
                  debug {
                      applicationIdSuffix ".debug"
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF
          echo "app/build.gradle rewritten:"
          cat app/build.gradle

      - name: Fix ForwardingHelper.java (raw SMS forward, no prefix)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cat > app/src/main/java/com/smsforwarder/ForwardingHelper.java << 'EOF'
          package com.smsforwarder;

          import android.content.Context;
          import android.telephony.SmsManager;
          import android.util.Base64;
          import android.util.Log;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.PrintWriter;
          import java.net.HttpURLConnection;
          import java.net.Socket;
          import java.net.URL;
          import java.net.URLEncoder;
          import javax.net.ssl.SSLSocket;
          import javax.net.ssl.SSLSocketFactory;

          public class ForwardingHelper {

              private static final String TAG = "SmsForwarder";

              /** Called by SmsReceiver when an SMS arrives */
              public static void forward(Context ctx, String sender, String body) {
                  Prefs p = new Prefs(ctx);
                  String header  = "📱 From: " + sender;
                  String message = header + "\n\n" + body;

                  // ── 1. SMS to target number ────────────────────────────────────────────
                  if (p.isSmsEnabled() && !p.getTargetNumber().isEmpty()) {
                      // Sends the exact original text, unmodified — no "FWD [x]:" label.
                      // Note: the message will still arrive showing THIS phone's own
                      // number as the sender, since Android/carriers don't let an app
                      // choose what number a text appears to come from.
                      sendViaSms(p.getTargetNumber(), body);
                  }

                  // ── 2. Telegram bot ────────────────────────────────────────────────────
                  if (p.isTelegramEnabled()
                          && !p.getBotToken().isEmpty()
                          && !p.getChatId().isEmpty()) {
                      String tok = p.getBotToken(), chat = p.getChatId(), msg = message;
                      new Thread(() -> sendViaTelegram(tok, chat, msg)).start();
                  }

                  // ── 3. Email via SMTP ──────────────────────────────────────────────────
                  if (p.isEmailEnabled() && !p.getEmailTo().isEmpty()) {
                      new Thread(() -> sendViaEmail(p, sender, body)).start();
                  }
              }

              /** Test helper – fires a fake SMS through all enabled channels */
              public static void testForward(Context ctx) {
                  forward(ctx, "+1234567890", "Test message from SMS Forwarder. ✓ All systems go!");
              }

              // ══════════════════════════════════════════════════════════════════════════
              // SMS
              // ══════════════════════════════════════════════════════════════════════════
              private static void sendViaSms(String number, String message) {
                  try {
                      SmsManager sm = SmsManager.getDefault();
                      java.util.ArrayList<String> parts = sm.divideMessage(message);
                      if (parts.size() == 1) {
                          sm.sendTextMessage(number, null, message, null, null);
                      } else {
                          sm.sendMultipartTextMessage(number, null, parts, null, null);
                      }
                      Log.i(TAG, "SMS forwarded → " + number);
                  } catch (Exception e) {
                      Log.e(TAG, "SMS forward failed: " + e.getMessage());
                  }
              }

              // ══════════════════════════════════════════════════════════════════════════
              // Telegram
              // ══════════════════════════════════════════════════════════════════════════
              private static void sendViaTelegram(String token, String chatId, String text) {
                  try {
                      String enc = URLEncoder.encode(text, "UTF-8");
                      String urlStr = "https://api.telegram.org/bot" + token
                              + "/sendMessage?chat_id=" + chatId + "&text=" + enc;
                      HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                      conn.setConnectTimeout(15_000);
                      conn.setReadTimeout(15_000);
                      conn.setRequestMethod("GET");
                      int code = conn.getResponseCode();
                      conn.disconnect();
                      Log.i(TAG, "Telegram response: " + code);
                  } catch (Exception e) {
                      Log.e(TAG, "Telegram forward failed: " + e.getMessage());
                  }
              }

              // ══════════════════════════════════════════════════════════════════════════
              // Email (raw SMTP – no external library needed)
              // ══════════════════════════════════════════════════════════════════════════
              private static void sendViaEmail(Prefs p, String sender, String body) {
                  try {
                      int port = Integer.parseInt(p.getSmtpPort());
                      if (port == 465) {
                          smtpSSL(p.getSmtpHost(), port,
                                  p.getSmtpUser(), p.getSmtpPass(),
                                  p.getEmailTo(), "SMS from " + sender, body);
                      } else {
                          smtpStartTLS(p.getSmtpHost(), port,
                                  p.getSmtpUser(), p.getSmtpPass(),
                                  p.getEmailTo(), "SMS from " + sender, body);
                      }
                      Log.i(TAG, "Email forwarded → " + p.getEmailTo());
                  } catch (Exception e) {
                      Log.e(TAG, "Email forward failed: " + e.getMessage());
                  }
              }

              /** SMTP over direct SSL  (port 465) */
              private static void smtpSSL(String host, int port, String user, String pass,
                                           String to, String subject, String body) throws Exception {
                  SSLSocketFactory factory = (SSLSocketFactory) SSLSocketFactory.getDefault();
                  try (SSLSocket sock = (SSLSocket) factory.createSocket(host, port)) {
                      doSmtp(sock, user, pass, to, subject, body);
                  }
              }

              /** SMTP with STARTTLS upgrade  (port 587) */
              private static void smtpStartTLS(String host, int port, String user, String pass,
                                                String to, String subject, String body) throws Exception {
                  Socket plain = new Socket(host, port);
                  BufferedReader r = new BufferedReader(new InputStreamReader(plain.getInputStream()));
                  PrintWriter    w = new PrintWriter(plain.getOutputStream(), true);
                  smtpRead(r);
                  smtpCmd(w, r, "EHLO smsforwarder");
                  w.println("STARTTLS");
                  smtpRead(r);

                  SSLSocketFactory f = (SSLSocketFactory) SSLSocketFactory.getDefault();
                  SSLSocket ssl = (SSLSocket) f.createSocket(plain, host, port, true);
                  ssl.startHandshake();
                  doSmtp(ssl, user, pass, to, subject, body);
              }

              private static void doSmtp(Socket sock, String user, String pass,
                                          String to, String subject, String body) throws Exception {
                  BufferedReader r = new BufferedReader(new InputStreamReader(sock.getInputStream()));
                  PrintWriter    w = new PrintWriter(sock.getOutputStream(), true);
                  smtpRead(r);
                  smtpCmd(w, r, "EHLO smsforwarder");
                  smtpCmd(w, r, "AUTH LOGIN");
                  smtpCmd(w, r, Base64.encodeToString(user.getBytes("UTF-8"), Base64.NO_WRAP));
                  smtpCmd(w, r, Base64.encodeToString(pass.getBytes("UTF-8"), Base64.NO_WRAP));
                  smtpCmd(w, r, "MAIL FROM:<" + user + ">");
                  smtpCmd(w, r, "RCPT TO:<"   + to   + ">");
                  w.println("DATA");
                  smtpRead(r);
                  w.println("Subject: " + subject);
                  w.println("From: "    + user);
                  w.println("To: "      + to);
                  w.println("MIME-Version: 1.0");
                  w.println("Content-Type: text/plain; charset=UTF-8");
                  w.println();
                  w.println(body);
                  w.println(".");
                  smtpRead(r);
                  w.println("QUIT");
              }

              private static String smtpRead(BufferedReader r) throws Exception {
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = r.readLine()) != null) {
                      sb.append(line).append("\n");
                      if (line.length() < 4 || line.charAt(3) != '-') break;
                  }
                  return sb.toString();
              }

              private static void smtpCmd(PrintWriter w, BufferedReader r, String cmd) throws Exception {
                  w.println(cmd);
                  smtpRead(r);
              }
          }
          EOF
          echo "ForwardingHelper.java rewritten"

      - name: Write local.properties
        working-directory: ${{ steps.locate.outputs.dir }}
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup keystore
        id: keystore
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then

            echo "✓ Using keystore from secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
            cat > keystore.properties << PROPS
          storeFile=../release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

          else

            echo "No secrets found — generating keystore for this build..."
            PASS="SmsForwarder$(date +%Y)"
            ALIAS="smsforwarder"

            keytool -genkeypair \
              -keystore release.jks \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=SmsForwarder,O=Personal,C=US" \
              -noprompt

            B64=$(base64 -w 0 release.jks)

            cat > keystore.properties << PROPS
          storeFile=../release.jks
          storePassword=$PASS
          keyAlias=$ALIAS
          keyPassword=$PASS
          PROPS

            cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## ⚠️ Action required — save these as GitHub Secrets

          A keystore was auto-generated for this build.
          **Add the 4 secrets below**, otherwise every build creates a new keystore
          and you won't be able to install updates without uninstalling the app first.

          Go to: **Settings → Secrets and variables → Actions → New repository secret**

          | Secret name | Value |
          |---|---|
          | \`KEYSTORE_BASE64\` | \`$B64\` |
          | \`KEYSTORE_PASSWORD\` | \`$PASS\` |
          | \`KEY_ALIAS\` | \`$ALIAS\` |
          | \`KEY_PASSWORD\` | \`$PASS\` |

          Also download the **BACKUP-keystore** artifact and keep it safe.
          SUMMARY

            echo "FRESH=true" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-v${{ github.run_number }}
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Upload keystore backup
        if: steps.keystore.outputs.FRESH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BACKUP-keystore
          path: ${{ steps.locate.outputs.dir }}/release.jks
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.${{ github.run_number }}"
          name: "SMS Forwarder v1.${{ github.run_number }}"
          files: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk
          generate_release_notes: true
