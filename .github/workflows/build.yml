name: Build & Sign APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then

            echo "✓ Using keystore from secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
            cat > keystore.properties << PROPS
          storeFile=../release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

          else

            echo "No secrets found — generating keystore for this build..."
            PASS="SmsForwarder$(date +%Y)"
            ALIAS="smsforwarder"

            keytool -genkeypair \
              -keystore release.jks \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=SmsForwarder,O=Personal,C=US" \
              -noprompt

            B64=$(base64 -w 0 release.jks)

            cat > keystore.properties << PROPS
          storeFile=../release.jks
          storePassword=$PASS
          keyAlias=$ALIAS
          keyPassword=$PASS
          PROPS

            cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## ⚠️ Action required — save these as GitHub Secrets

          A keystore was auto-generated for this build.
          **Add the 4 secrets below**, otherwise every build creates a new keystore
          and you won't be able to install updates without uninstalling the app first.

          Go to: **Settings → Secrets and variables → Actions → New repository secret**

          | Secret name | Value |
          |---|---|
          | \`KEYSTORE_BASE64\` | \`$B64\` |
          | \`KEYSTORE_PASSWORD\` | \`$PASS\` |
          | \`KEY_ALIAS\` | \`$ALIAS\` |
          | \`KEY_PASSWORD\` | \`$PASS\` |

          Also download the **BACKUP-keystore** artifact and keep it safe.
          SUMMARY

            echo "FRESH=true" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-v${{ github.run_number }}
          path: app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Upload keystore backup
        if: steps.keystore.outputs.FRESH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BACKUP-keystore
          path: release.jks
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.${{ github.run_number }}"
          name: "SMS Forwarder v1.${{ github.run_number }}"
          files: app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk
          generate_release_notes: true
