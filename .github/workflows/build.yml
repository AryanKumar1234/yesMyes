name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        id: extract
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          mkdir -p _project
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -q -o "$ZIP" -d _project
          else
            echo "No zip found, using repo root"
            rsync -a --exclude=_project --exclude=.git ./ _project/
          fi
          SETTINGS=$(find _project \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle found"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Locate APK
        run: |
          APK_PATH=$(find "${{ steps.extract.outputs.dir }}/app/build/outputs/apk" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          cp "$APK_PATH" sms-forwarder.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-debug-apk
          path: sms-forwarder.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: sms-forwarder.apk
          body: Automated debug build from commit ${{ github.sha }}.
