name: Build & Sign APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        type: boolean
        default: false

permissions:
  contents: write   # required for creating GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3   # handles caching automatically

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"; exit 1; fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD is not set"; exit 1; fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Secret KEY_ALIAS is not set"; exit 1; fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secret KEY_PASSWORD is not set"; exit 1; fi
          echo "All secrets present ✓"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "Keystore size: $(wc -c < release.jks) bytes"

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=../release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-v${{ github.run_number }}
          path: app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.${{ github.run_number }}"
          name: "SMS Forwarder v1.${{ github.run_number }}"
          files: app/build/outputs/apk/release/sms-forwarder-v${{ github.run_number }}.apk
          generate_release_notes: true
